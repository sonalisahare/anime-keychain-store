<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | AnimeVerse</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#CDEFFC;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:380px;
    background:white;
    padding:40px;
    border-radius:25px;
    box-shadow:0 15px 35px rgba(0,0,0,.15);
}

.logo{
    text-align:center;
    font-size:45px;
    margin-bottom:10px;
}

h1{
    text-align:center;
    color:#6C3EF4;
    margin-bottom:10px;
}

p{
    text-align:center;
    color:#666;
    margin-bottom:30px;
}

.input-box{
    margin-bottom:20px;
}

.input-box label{
    display:block;
    margin-bottom:8px;
    color:#444;
    font-weight:600;
}

.input-box input{
    width:100%;
    padding:14px;
    border:2px solid #CDEFFC;
    border-radius:12px;
    outline:none;
    font-size:15px;
}

.input-box input:focus{
    border-color:#6C3EF4;
}

.options{
    display:flex;
    justify-content:space-between;
    margin-bottom:20px;
    font-size:14px;
}

.options a{
    text-decoration:none;
    color:#6C3EF4;
}

.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#6C3EF4;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.btn:hover{
    background:#5530d9;
}

.register{
    text-align:center;
    margin-top:20px;
    color:#555;
}

.register a{
    color:#6C3EF4;
    text-decoration:none;
    font-weight:bold;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    text-decoration:none;
    color:#6C3EF4;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">🌸</div>

<h1>Welcome Back</h1>

<p>Login to AnimeVerse</p>

<form method="POST">

{% csrf_token %}

<div class="input-box">
<label>Email</label>
<input type="email" placeholder="Enter your email" required>
</div>

<div class="input-box">
<label>Password</label>
<input type="password" placeholder="Enter your password" required>
</div>

<div class="options">
<label>
<input type="checkbox"> Remember Me
</label>

<a href="#">Forgot Password?</a>
</div>

<button class="btn" type="submit">
Login
</button>

</form>

<div class="register">
Don't have an account?
<a href="#">Register</a>
</div>

<a href="{% url 'home' %}" class="back">
🏠 Back to Home
</a>

</div>

</body>
</html>
