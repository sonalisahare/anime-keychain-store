<!DOCTYPE html>
<html>
<head>
    <title>❤️ Wishlist</title>

    <style>
        body{
            margin:0;
            font-family:Poppins,sans-serif;
            background:#F5F7FB;
        }

        .navbar{
            background:linear-gradient(90deg,#6D28D9,#EC4899);
            color:white;
            padding:20px;
            text-align:center;
            font-size:30px;
            font-weight:bold;
        }

        .back{
            display:inline-block;
            margin:20px;
            padding:12px 25px;
            background:#6D28D9;
            color:white;
            text-decoration:none;
            border-radius:10px;
        }

        .products{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:25px;
            padding:30px;
        }

        .card{
            background:white;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 8px 20px rgba(0,0,0,.08);
            text-align:center;
        }

        .card img{
            width:100%;
            height:250px;
            object-fit:cover;
        }

        .card h3{
            color:#333;
        }

        .price{
            color:#6D28D9;
            font-size:24px;
            font-weight:bold;
        }

        .btn{
            display:block;
            margin:15px;
            padding:12px;
            text-decoration:none;
            border-radius:30px;
            color:white;
            background:#EC4899;
        }

        .btn:hover{
            background:#6D28D9;
        }

        .empty{
            text-align:center;
            font-size:30px;
            color:#6D28D9;
            margin-top:100px;
        }
    </style>

</head>

<body>

<div class="navbar">
    ❤️ My Wishlist
</div>

<a href="{% url 'home' %}" class="back">← Back to Shop</a>

<div class="products">

{% for item in wishlist %}

<div class="card">

    <img src="{{ item.product.image.url }}">

    <h3>{{ item.product.name }}</h3>

    <p class="price">
        ₹{{ item.product.price }}
    </p>

    <a href="{% url 'add_to_cart' item.product.id %}" class="btn">
        🛒 Move to Cart
    </a>

</div>

{% empty %}

<div class="empty">
    ❤️ Your Wishlist is Empty
</div>

{% endfor %}

</div>

</body>
</html>
